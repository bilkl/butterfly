name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Tests
        run: uv run pytest
      - name: Style
        run: uv run ruff check .
      - name: Typage strict
        run: uv run mypy butterfly butterfly_server tests
