[project]
name = "butterfly-lang"
version = "0.1.0"
description = "Butterfly : un langage réactif transpilé en Python, avec son serveur MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
butterfly = "butterfly.cli:main"
butterfly-mcp = "serveur_butterfly.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "markdown>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["butterfly", "serveur_butterfly"]

# --- pytest -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

# --- mypy ---------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
exclude = ['(^|/)\.venv/', '(^|/)site/dist/']

# --- ruff ---------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["site/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Les tests contiennent des programmes Butterfly écrits en texte : lignes longues permises.
"tests/*" = ["E501"]
# Le générateur du site contient des phrases françaises en littéraux.
"site/build.py" = ["E501"]
