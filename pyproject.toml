[project]
name = "butterfly-lang"
version = "0.1.0"
description = "Butterfly: a reactive language transpiled to Python, with its MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
butterfly = "butterfly.cli:main"
butterfly-mcp = "butterfly_server.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "markdown>=3.6",
]
# Building the explanatory video (uv sync --group video)
video = [
    "imageio-ffmpeg>=0.5",
    "websockets>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["butterfly", "butterfly_server"]

# --- pytest -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

# --- mypy ---------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
exclude = ['(^|/)\.venv/', '(^|/)site/dist/']

# --- ruff ---------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["site/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests contain Butterfly programs written as text: long lines allowed.
"tests/*" = ["E501"]
# The site generator contains long text literals.
"site/build.py" = ["E501"]
# Les scripts de la vidéo contiennent des phrases et des programmes en littéraux.
"video/*.py" = ["E501"]
