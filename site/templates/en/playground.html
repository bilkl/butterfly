<section class="atelier">
  <h1>Try Butterfly</h1>
  <p class="chapeau">
    Write a program and run it here: the real Butterfly compiler runs in your
    browser, thanks to Python compiled to WebAssembly.
  </p>

  <div class="atelier-barre">
    <label for="choix-exemple">Start from an example</label>
    <select id="choix-exemple"></select>
    <button type="button" class="bouton" id="executer" disabled>Run</button>
    <span class="statut" id="statut" role="status">Loading Python, about 10 MB…</span>
  </div>

  <div class="atelier-grille">
    <div class="atelier-colonne">
      <label for="editeur">Program</label>
      <textarea id="editeur" spellcheck="false" autocapitalize="off" autocomplete="off" rows="18"></textarea>
      <p class="aide">Ctrl + Enter to run.</p>
    </div>
    <div class="atelier-colonne">
      <div class="onglets" role="tablist" aria-label="Result">
        <button type="button" role="tab" aria-selected="true" id="onglet-sortie" aria-controls="panneau-sortie">Output</button>
        <button type="button" role="tab" aria-selected="false" id="onglet-python" aria-controls="panneau-python">Generated Python</button>
      </div>
      <pre class="code sortie" id="panneau-sortie" role="tabpanel" aria-labelledby="onglet-sortie" aria-live="polite"><code>The output will appear here.</code></pre>
      <pre class="code" id="panneau-python" role="tabpanel" aria-labelledby="onglet-python" hidden><code></code></pre>
    </div>
  </div>
</section>

<script type="application/json" id="exemples">@@EXEMPLES_JSON@@</script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="@@ROOT@@static/playground.js"></script>
